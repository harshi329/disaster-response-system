{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block auth_content %}
<div class="card shadow-lg auth-card" style="max-width:480px;">
  <div class="card-body p-5">
    <div class="text-center mb-4">
      <i class="bi bi-person-plus text-danger" style="font-size:3rem;"></i>
      <h3 class="fw-bold mt-2">Create Account</h3>
    </div>

    <!-- Google OAuth button -->
    <a href="{{ url_for('auth.google_login') }}"
       class="btn w-100 fw-semibold py-2 mb-3 d-flex align-items-center justify-content-center gap-2"
       style="border:1.5px solid #dadce0;background:#fff;color:#3c4043;font-size:.95rem;">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </a>

    <div class="d-flex align-items-center gap-2 mb-3">
      <hr class="flex-grow-1 m-0" />
      <span class="text-muted small">or register with email</span>
      <hr class="flex-grow-1 m-0" />
    </div>

    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" name="username" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" name="email" class="form-control" required />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Phone</label>
        <input type="tel" name="phone" class="form-control" placeholder="+1234567890" />
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-danger w-100 fw-bold py-2">
        <i class="bi bi-person-check me-2"></i>Register
      </button>
    </form>
    <p class="text-center mt-3 mb-0">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="text-danger fw-semibold">Login</a>
    </p>
  </div>
</div>
{% endblock %}
